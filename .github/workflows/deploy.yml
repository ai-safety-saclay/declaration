name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # every hour (UTC); GitHub may delay runs a bit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site
        env:
          # Proca signatures (public) and the Grist form holding public comments.
          PROCA_URL: https://vurrrokassxubbxlvufw.supabase.co/functions/v1/actions-1061
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          FORM_DOC_ID: ${{ secrets.FORM_DOC_ID }}
        run: uv run build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
