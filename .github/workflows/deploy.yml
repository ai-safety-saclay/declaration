name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # every hour (UTC); GitHub may delay runs a bit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site
        env:
          # Set this repo variable once the backend exists; falls back to data/signatories.json.
          SIGNATORIES_URL: ${{ vars.SIGNATORIES_URL }}
        run: uv run build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
