  <main>
    <section class="statement">
      <h2>{{t.our_request}}</h2>
      <div class="card">
        {{declaration}}
      </div>
    </section>

    <section class="signatories" id="signataires">
      <h2>{{t.signatories}}</h2>
      <div class="logos sign-logo">
        <img class="padded" src="{{root}}logos/piaf.png" alt="PIAF" title="PIAF (Paris-Saclay)">
        <img class="padded" src="{{root}}logos/logo-tuxae.png" alt="Tuxae" title="Tuxae (ENSAE)">
        <img class="padded" src="{{root}}logos/logo-telecom-ia.png" alt="Telecom IA" title="Telecom IA (Telecom Paris)">
        <img class="padded" src="{{root}}logos/rezal-crop.png" alt="Rezal" title="Rezal">
        <img class="padded" src="{{root}}logos/logo-automatants.png" alt="Automatants" title="Automatants (Centrale Supelec)">
        <img class="padded" src="{{root}}logos/logo-data-ensta.png" alt="Data" title="Data (Ensta Paris)">
        <img src="{{root}}logos/dau-ia-crop.jpg" alt="DAU'IA" title="DAU'IA (Dauphine)">
      </div>
      <div class="card">
        <ul class="preview">
          {{signatories}}
        </ul>
      </div>
      <a class="all-signatories" href="{{href_signatories}}">{{t.see_all}} ({{count}})</a>
      <p class="updated">{{t.updated}} {{updated}}</p>
      <div class="card sign" id="signature">
        <h2>{{t.sign}}</h2>
        <script src="https://widget.proca.app/d/{{t.widget}}" async></script>
        <script>
          // Hack: the widget offers no setting for the e-mail field's label, so
          // rewrite its text, again whenever React redraws the form.
          (() => {
            const text = "{{t.email_label}}";
            const relabel = () => {
              const label = document.querySelector('label[for="email"]');
              const node = label && [...label.childNodes].find(n => n.nodeType === Node.TEXT_NODE && n.textContent.trim());
              if (node && node.textContent !== text) node.textContent = text;
            };
            new MutationObserver(relabel).observe(document.body, { childList: true, subtree: true, characterData: true });
          })();
        </script>
        <a class="add-comment" href="https://docs.getgrist.com/forms/hDGYGcUPYiuPbKRUo3Bvnp/25" target="_blank" rel="noopener noreferrer">{{t.add_comment}}</a>
      </div>
      <div class="contact-asks">
        <a href="{{href_contact}}#associations" class="contact-link">{{t.sign_organisation}}</a>
        <a href="{{href_contact}}" class="contact-link">{{t.get_in_touch}}</a>
      </div>
    </section>
  </main>
