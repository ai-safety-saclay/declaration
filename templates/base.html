<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="fr" href="{{url_fr}}">
  <link rel="alternate" hreflang="en" href="{{url_en}}">
  <link rel="alternate" hreflang="x-default" href="{{url_fr}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{title}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:locale:alternate" content="{{og_locale_alt}}">
  <meta property="og:image" content="{{share_image}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page_title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{share_image}}">
  <meta name="twitter:image:alt" content="{{title}}">
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body>
  <div class="topbar">
    <div class="wip">{{t.wip}}</div>
    {{back_bar}}
  </div>
  <header>
    <nav class="lang-switch" aria-label="Langue / Language">
      <a href="{{href_fr}}" hreflang="fr" lang="fr"{{current_fr}}>FR</a> · <a href="{{href_en}}" hreflang="en" lang="en"{{current_en}}>EN</a>
    </nav>
    <h1>{{title}}</h1>
  </header>
{{main}}
  <footer class="site-footer">{{footer}}</footer>
</body>
</html>
