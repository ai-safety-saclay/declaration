<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>{{title}}</h1>
  </header>

  <main>
    <section class="statement">
      <h2>Notre demande</h2>
      <div class="card">
        {{declaration}}
      </div>
    </section>

    <section class="signatories" id="signataires">
      <h2>Signataires <span class="count">({{count}})</span></h2>
      <div class="card">
        <ul>
          {{signatories}}
        </ul>
      </div>
      <p class="updated">Mis à jour le {{updated}}</p>

      <div class="card sign">
        <h2>Signer l’appel</h2>
        <div class="placeholder">[Widget de signature — non implémenté]</div>
      </div>
      <div class="logos">
        <img class="padded" src="logos/piaf.png" alt="PIAF">
        <img src="logos/unaite.png" alt="Unaite">
        <img src="logos/pauseia.png" alt="Pause IA">
      </div>
      <p class="contact">Pour signer en tant qu’association, contactez-nous à <a href="mailto:contact@piaf-saclay.org">contact@piaf-saclay.org</a>.</p>
    </section>
  </main>
</body>
</html>
